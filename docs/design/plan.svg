<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="800" fill="#040d24"/>
  <text x="40" y="56" font-size="28" fill="#ffffff" letter-spacing="3">DROPWISE — DESIGN PLAN</text>
  <text x="40" y="82" font-size="14" fill="#9fb6d9">Site map · shared state · layout · palette · user flow</text>

  <!-- 1 · Site map -->
  <rect x="40" y="110" width="540" height="300" rx="18" fill="#071a45" stroke="#1a2d5c"/>
  <text x="60" y="140" font-size="14" fill="#5fd3ff" letter-spacing="2">1 · SITE MAP</text>
  <g stroke="#5fd3ff" stroke-opacity=".5" fill="none">
    <path d="M160 260 H195 V198 H230"/><path d="M160 260 H195 V262 H230"/><path d="M160 260 H195 V348 H230"/>
    <path d="M330 262 H355 V184 H380"/><path d="M330 262 H355 V220 H380"/><path d="M330 262 H355 V256 H380"/><path d="M330 262 H355 V292 H380"/><path d="M330 262 H355 V328 H380"/>
  </g>
  <g font-size="13" fill="#eaf3ff" text-anchor="middle">
    <rect x="60" y="240" width="100" height="40" rx="10" fill="#2563ff"/><text x="110" y="265">Home</text>
    <rect x="230" y="180" width="100" height="36" rx="10" fill="#0b2a66" stroke="#5fd3ff"/><text x="280" y="203">Problem</text>
    <rect x="230" y="244" width="100" height="36" rx="10" fill="#0b2a66" stroke="#5fd3ff"/><text x="280" y="267">Solution</text>
    <rect x="230" y="330" width="100" height="36" rx="10" fill="#0b2a66" stroke="#1a2d5c"/><text x="280" y="353">About</text>
    <rect x="380" y="170" width="170" height="28" rx="8" fill="#0b2a66"/><text x="465" y="189">Irrigation lab</text>
    <rect x="380" y="206" width="170" height="28" rx="8" fill="#0b2a66"/><text x="465" y="225">Reuse loop</text>
    <rect x="380" y="242" width="170" height="28" rx="8" fill="#0b2a66"/><text x="465" y="261">Desalination sizer</text>
    <rect x="380" y="278" width="170" height="28" rx="8" fill="#0b2a66"/><text x="465" y="297">Leak hunter</text>
    <rect x="380" y="314" width="170" height="28" rx="8" fill="#0b2a66"/><text x="465" y="333">Home audit</text>
  </g>
  <text x="60" y="395" font-size="12" fill="#9fb6d9">One tool for each solution in the brief. Everything in English, Romanian and Russian.</text>

  <!-- 2 · Shared state -->
  <rect x="620" y="110" width="540" height="300" rx="18" fill="#071a45" stroke="#1a2d5c"/>
  <text x="640" y="140" font-size="14" fill="#5fd3ff" letter-spacing="2">2 · SHARED STATE</text>
  <rect x="760" y="156" width="260" height="44" rx="12" fill="#2563ff"/>
  <text x="890" y="183" font-size="14" fill="#fff" text-anchor="middle">WaterProvider (React context)</text>
  <g stroke="#5fd3ff" stroke-opacity=".6" fill="none">
    <path d="M830 200 V218 H695 V240"/><path d="M860 200 V218 H819 V240"/><path d="M920 200 V218 H943 V240"/><path d="M950 200 V218 H1067 V240"/>
  </g>
  <g font-size="12" fill="#eaf3ff" text-anchor="middle">
    <rect x="640" y="240" width="110" height="34" rx="8" fill="#0b2a66"/><text x="695" y="262">Irrigation</text>
    <rect x="764" y="240" width="110" height="34" rx="8" fill="#0b2a66"/><text x="819" y="262">Reuse</text>
    <rect x="888" y="240" width="110" height="34" rx="8" fill="#0b2a66"/><text x="943" y="262">Desalination</text>
    <rect x="1012" y="240" width="110" height="34" rx="8" fill="#0b2a66"/><text x="1067" y="262">Home audit</text>
  </g>
  <path d="M1067 274 V318 H1040" stroke="#ffb259" fill="none"/>
  <rect x="800" y="302" width="240" height="34" rx="8" fill="none" stroke="#ffb259"/>
  <text x="920" y="324" font-size="12" fill="#ffb259" text-anchor="middle">Plan total in the sidebar, every page</text>
  <text x="640" y="372" font-size="12" fill="#9fb6d9">Saved to localStorage and re-validated field by field on load.</text>
  <text x="640" y="392" font-size="12" fill="#9fb6d9">No server, no account, nothing leaves the device.</text>

  <!-- 3 · Layout -->
  <rect x="40" y="430" width="540" height="330" rx="18" fill="#071a45" stroke="#1a2d5c"/>
  <text x="60" y="460" font-size="14" fill="#5fd3ff" letter-spacing="2">3 · LAYOUT — NAVIGATION ON THE RIGHT</text>
  <g>
    <rect x="60" y="480" width="330" height="210" rx="10" fill="#040d24" stroke="#5fd3ff" stroke-opacity=".6"/>
    <rect x="60" y="480" width="248" height="26" rx="10" fill="#0b2a66"/>
    <rect x="70" y="489" width="50" height="8" rx="3" fill="#5fd3ff"/>
    <rect x="236" y="487" width="64" height="12" rx="6" fill="#2563ff"/>
    <rect x="70" y="520" width="228" height="100" rx="8" fill="#10306e"/>
    <text x="184" y="566" font-size="12" fill="#eaf3ff" text-anchor="middle">Full-screen slideshow</text>
    <rect x="70" y="632" width="70" height="46" rx="8" fill="#0b2a66"/><rect x="150" y="632" width="70" height="46" rx="8" fill="#0b2a66"/><rect x="230" y="632" width="68" height="46" rx="8" fill="#0b2a66"/>
    <rect x="316" y="488" width="66" height="194" rx="10" fill="#0b2a66" stroke="#5fd3ff"/>
    <g fill="#5fd3ff" fill-opacity=".6"><rect x="324" y="502" width="50" height="5" rx="2"/><rect x="324" y="520" width="50" height="5" rx="2"/><rect x="324" y="538" width="50" height="5" rx="2"/><rect x="324" y="556" width="50" height="5" rx="2"/><rect x="324" y="574" width="50" height="5" rx="2"/><rect x="324" y="592" width="50" height="5" rx="2"/></g>
    <rect x="324" y="646" width="50" height="26" rx="6" fill="#2563ff"/>
    <text x="225" y="708" font-size="12" fill="#9fb6d9" text-anchor="middle">Desktop: fixed panel on the right</text>
  </g>
  <g>
    <rect x="430" y="480" width="86" height="190" rx="14" fill="#040d24" stroke="#5fd3ff" stroke-opacity=".6"/>
    <rect x="430" y="480" width="86" height="22" rx="14" fill="#0b2a66"/>
    <rect x="438" y="488" width="26" height="6" rx="3" fill="#5fd3ff"/>
    <g fill="#eaf3ff"><rect x="496" y="487" width="12" height="2"/><rect x="496" y="492" width="12" height="2"/></g>
    <rect x="460" y="508" width="52" height="156" rx="10" fill="#0b2a66" stroke="#5fd3ff"/>
    <path d="M458 580 h-16 m6 -6 l-6 6 l6 6" stroke="#ffb259" fill="none" stroke-width="2"/>
    <text x="473" y="708" font-size="12" fill="#9fb6d9" text-anchor="middle">Phone: drawer from the right</text>
  </g>
  <text x="60" y="738" font-size="12" fill="#9fb6d9">Header: logo left, home audit as a quick action.</text>

  <!-- 4 · Palette -->
  <rect x="620" y="430" width="540" height="150" rx="18" fill="#071a45" stroke="#1a2d5c"/>
  <text x="640" y="460" font-size="14" fill="#5fd3ff" letter-spacing="2">4 · PALETTE AND TYPE</text>
  <g font-size="10" fill="#9fb6d9" text-anchor="middle">
    <rect x="640" y="474" width="50" height="50" rx="10" fill="#020814" stroke="#1a2d5c"/><text x="665" y="540">ink</text>
    <rect x="700" y="474" width="50" height="50" rx="10" fill="#040d24" stroke="#1a2d5c"/><text x="725" y="540">navy</text>
    <rect x="760" y="474" width="50" height="50" rx="10" fill="#071a45" stroke="#2a4a9a"/><text x="785" y="540">deep</text>
    <rect x="820" y="474" width="50" height="50" rx="10" fill="#2563ff"/><text x="845" y="540">royal</text>
    <rect x="880" y="474" width="50" height="50" rx="10" fill="#5fd3ff"/><text x="905" y="540">aqua</text>
    <rect x="940" y="474" width="50" height="50" rx="10" fill="#cfe5ff"/><text x="965" y="540">ice</text>
    <rect x="1000" y="474" width="50" height="50" rx="10" fill="#ffb259"/><text x="1025" y="540">sand</text>
    <rect x="1060" y="474" width="50" height="50" rx="10" fill="#ff5d73"/><text x="1085" y="540">coral</text>
  </g>
  <text x="640" y="566" font-size="12" fill="#9fb6d9">Tenor Sans (tracked capitals) · Manrope (text) · JetBrains Mono (labels)</text>

  <!-- 5 · User flow -->
  <rect x="620" y="600" width="540" height="160" rx="18" fill="#071a45" stroke="#1a2d5c"/>
  <text x="640" y="630" font-size="14" fill="#5fd3ff" letter-spacing="2">5 · USER FLOW</text>
  <g font-size="11" fill="#eaf3ff" text-anchor="middle">
    <rect x="636" y="654" width="86" height="64" rx="10" fill="#2563ff"/><text x="679" y="682">Hero</text><text x="679" y="697">slideshow</text>
    <rect x="736" y="654" width="86" height="64" rx="10" fill="#0b2a66" stroke="#5fd3ff"/><text x="779" y="682">Problem:</text><text x="779" y="697">100 litres</text>
    <rect x="836" y="654" width="86" height="64" rx="10" fill="#0b2a66" stroke="#5fd3ff"/><text x="879" y="682">Solution:</text><text x="879" y="697">five fixes</text>
    <rect x="936" y="654" width="86" height="64" rx="10" fill="#0b2a66" stroke="#5fd3ff"/><text x="979" y="682">Try a</text><text x="979" y="697">tool</text>
    <rect x="1036" y="654" width="86" height="64" rx="10" fill="#0b2a66" stroke="#ffb259"/><text x="1079" y="682">Plan in</text><text x="1079" y="697">the sidebar</text>
  </g>
  <g stroke="#5fd3ff" fill="none"><path d="M722 686 h14 m-5 -4 l5 4 l-5 4"/><path d="M822 686 h14 m-5 -4 l5 4 l-5 4"/><path d="M922 686 h14 m-5 -4 l5 4 l-5 4"/><path d="M1022 686 h14 m-5 -4 l5 4 l-5 4"/></g>
  <text x="640" y="744" font-size="12" fill="#9fb6d9">From a number too big to feel to a number you can change.</text>
</svg>
